version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pashusuraksha-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://localhost:5173
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5000
      - DATABASE_URL=sqlite://./pashusuraksha.sqlite
      - JWT_SECRET=pashu_production_docker_jwt_secret_key_2026
      - DEMO_MODE=true
      - OTP_MODE=mock
    restart: unless-stopped
